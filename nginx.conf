server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense-in-depth; site is static + Firebase-backed)
    # NOTE: production (infinisweeper.hackatoa.com) is served by GitHub Pages
    # (see .github/workflows/pages.yml), which ignores this file entirely.
    # This config only applies to the GHCR/Docker image built by deploy.yml.
    # The CSP is duplicated as a <meta http-equiv> tag in each public/*.html
    # so it actually reaches production; the other headers below have no
    # meta-tag equivalent and are unenforceable on Pages.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://cloudflareinsights.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Match Firebase Hosting's cleanUrls behavior: /leaderboard -> leaderboard.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
